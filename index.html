<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ziyaul Huk</title>
  <meta name="description" content="Personal site of Ziyaul Huk — software developer." />
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1c2733 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    h1 { font-size: 1.9rem; letter-spacing: -0.02em; margin-bottom: 8px; }
    .tagline { color: var(--muted); font-size: 1rem; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .links a:hover { border-color: var(--accent); transform: translateY(-1px); }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 36px 0 14px;
    }
    .project {
      display: block;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      text-align: left;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .project:hover { border-color: var(--accent); background: #1c2129; }
    .project strong { display: block; margin-bottom: 4px; font-size: 1rem; }
    .project span { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
    footer { margin-top: 28px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="avatar">ZH</div>
    <h1>Ziyaul Huk</h1>
    <p class="tagline">Software developer — building small, useful things.<br />Apps, tools, and the occasional homelab.</p>

    <div class="links">
      <a href="https://github.com/ziyaulhuk" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:ziyaulhuk@gmail.com">Email</a>
    </div>

    <h2>Projects</h2>
    <a class="project" href="https://github.com/ziyaulhuk/wedhub" target="_blank" rel="noopener">
      <strong>WedHub</strong>
      <span>Offline wedding invitation app — Vite + TypeScript, packaged for Android with Capacitor.</span>
    </a>
  </main>

  <footer>Built with plain HTML &amp; CSS · Hosted on GitHub Pages</footer>
</body>
</html>
